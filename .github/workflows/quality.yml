name: Cargo quality gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # ready_for_review: a draft (which GitHub cannot merge) skips CI until it is
    # marked ready, which then runs the full gate on its head.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      update_baselines:
        description: "Re-render layout baselines (download the layout-report artifact and commit tests/layout/__screenshots__)"
        type: boolean
        default: false
permissions:
  contents: read
# Actions minutes are a paid quota on this private repo. A newer push to the same PR
# cancels the run it supersedes. Pushes to main and manual runs get a group of
# their own (run_id), so they are never cancelled or replaced while queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Decides whether the ~10 minute layout job is needed. Changes that touch only
  # Markdown or docs/ cannot move the layout, so they skip it (verify still runs,
  # including the project-memory link checks). Manual runs always render.
  scope:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      layout: ${{ steps.diff.outputs.layout }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] || [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "layout=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE" HEAD | grep -qvE '^docs/|\.md$'; then
            echo "layout=true" >> "$GITHUB_OUTPUT"
          else
            echo "layout=false" >> "$GITHUB_OUTPUT"
          fi
          git diff --name-only "$BASE" HEAD | head -50

  verify:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build without production DB migrations
        run: npm run build
        env:
          DATABASE_URL: ''
      - name: Cloudflare Worker bundle check (wrangler dry-run, no deploy)
        run: npm run cf:dry-run

  # Layout lock (DEPLOY.md "Layout lock"): geometry assertions + screenshot baselines on
  # phone/tablet/laptop viewports in Chromium and WebKit. Runs in the official Playwright
  # image so browsers and fonts match the committed baselines exactly (no browser download).
  layout:
    name: layout lock
    needs: scope
    if: needs.scope.outputs.layout == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      CI: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build without production DB migrations
        run: npm run build
        env:
          DATABASE_URL: ''
      - name: Layout lock (Chromium + WebKit + Firefox)
        # Firefox refuses to start when $HOME is not owned by the current user, which
        # is the case for the job container (Playwright CI guidance: HOME=/root).
        env:
          HOME: /root
        run: npx playwright test --reporter=github,list
      - name: Upload report, diffs and rendered baselines
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: layout-report
          path: |
            playwright-report/
            test-results/
            tests/layout/__screenshots__/
          retention-days: 7
