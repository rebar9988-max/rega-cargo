# TEMPORARY — marketplace refinement (owner brief 2026-10-22), same route as PR #150's
# owner-approved workflow. Re-renders exactly the /stores and /stores/request page baselines
# (stores-*.png, stores-request-*.png × 9 screenshot projects) in the official Playwright image,
# plus unmasked review shots in tmp-review/, and commits them back to this branch, because the
# agent sandbox cannot install packages or download Actions artifacts. Runs only on pushes to
# this branch that change this file. Removed (with tmp-review/) before merge. Logo tile follow-up 2.
name: tmp marketplace baselines
on:
  push:
    branches: [claude/marketplace-logo-tile-20261023]
    paths: [.github/workflows/tmp-marketplace-baselines.yml]
permissions:
  contents: write
concurrency:
  group: tmp-marketplace-baselines
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      CI: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: TypeScript (report only)
        continue-on-error: true
        run: npm run typecheck
      - name: Lint (report only)
        continue-on-error: true
        run: npm run lint
      - name: Build without production DB migrations
        run: npm run build
        env:
          DATABASE_URL: ''
      - name: Re-render only the /stores and /stores/request page baselines
        env:
          HOME: /root
        run: >-
          npx playwright test tests/layout/layout.spec.ts
          --grep "stores(-request)? (ckb|ar|en)$"
          --project=chromium-iphone --project=chromium-iphone-se
          --project=chromium-ipad-portrait --project=chromium-ipad-landscape
          --project=chromium-laptop --project=chromium-laptop-1440
          --project=webkit-iphone --project=webkit-ipad-portrait --project=webkit-ipad-landscape
          --update-snapshots=all
      - name: Marketplace browser tests (report only)
        continue-on-error: true
        env:
          HOME: /root
        run: >-
          npx playwright test tests/layout/premium.spec.ts
          --project=premium-360 --project=firefox-premium-360
          --grep "marketplace refinement|european stores"
          --reporter=github,list
      - name: Commit exactly the re-rendered baselines
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -- 'tests/layout/__screenshots__/*/stores-ckb.png' \
                     'tests/layout/__screenshots__/*/stores-ar.png' \
                     'tests/layout/__screenshots__/*/stores-en.png' \
                     'tests/layout/__screenshots__/*/stores-request-ckb.png' \
                     'tests/layout/__screenshots__/*/stores-request-ar.png' \
                     'tests/layout/__screenshots__/*/stores-request-en.png'
          git status --short
          changed=$(git diff --cached --name-only | wc -l)
          others=$(git diff --cached --name-only | grep -cvE '^(tests/layout/__screenshots__/[a-z0-9-]+/stores(-request)?-(ckb|ar|en)\.png)$' || true)
          echo "staged=$changed others=$others"
          test "$others" = 0
          if [ "$changed" = 0 ]; then echo "baselines unchanged"; exit 0; fi
          git commit -m "test(layout): re-render the /stores and /stores/request baselines in the official Playwright image"
          git push origin "HEAD:${GITHUB_REF_NAME}"
