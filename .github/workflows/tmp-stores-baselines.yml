# TEMPORARY — owner-approved for PR #150 only (2026-10-22). Re-renders exactly the 27 full-page
# /stores baselines (stores-{ckb,ar,en}.png × 9 screenshot projects) in the official Playwright
# image and commits them back to this branch, because the agent sandbox cannot download Actions
# artifacts. Runs only on pushes to this branch that change this file. Removed before merge.
name: tmp stores baselines
on:
  push:
    branches: [claude/european-stores-directory-20261022]
    paths: [.github/workflows/tmp-stores-baselines.yml]
permissions:
  contents: write
concurrency:
  group: tmp-stores-baselines
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      CI: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build without production DB migrations
        run: npm run build
        env:
          DATABASE_URL: ''
      - name: Re-render only the /stores page baselines
        env:
          HOME: /root
        run: >-
          npx playwright test tests/layout/layout.spec.ts
          --grep "stores (ckb|ar|en)$"
          --project=chromium-iphone --project=chromium-iphone-se
          --project=chromium-ipad-portrait --project=chromium-ipad-landscape
          --project=chromium-laptop --project=chromium-laptop-1440
          --project=webkit-iphone --project=webkit-ipad-portrait --project=webkit-ipad-landscape
          --update-snapshots=all
      - name: Commit exactly the 27 /stores baselines
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -- 'tests/layout/__screenshots__/*/stores-ckb.png' \
                     'tests/layout/__screenshots__/*/stores-ar.png' \
                     'tests/layout/__screenshots__/*/stores-en.png'
          git status --short
          changed=$(git diff --cached --name-only | wc -l)
          others=$(git diff --cached --name-only | grep -cvE '^tests/layout/__screenshots__/[a-z0-9-]+/stores-(ckb|ar|en)\.png$' || true)
          echo "staged=$changed others=$others"
          test "$others" = 0
          test "$changed" -gt 0
          git commit -m "test(layout): re-render the /stores baselines in the official Playwright image"
          git push origin "HEAD:${GITHUB_REF_NAME}"
